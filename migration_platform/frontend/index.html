<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janus · Post-Quantum Migration</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#/dashboard" aria-label="Janus home">
      <img src="assets/logo-white.png" alt="">
      <span>
        <strong>JANUS</strong>
        <small>Post-Quantum Migration</small>
      </span>
    </a>

    <div>
      <div class="nav-label">Workspace</div>
      <nav>
        <a href="#/dashboard" data-nav="dashboard">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Overview
        </a>
        <a href="#/assets" data-nav="assets">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg>
          Asset inventory
        </a>
        <a href="#/algorithms" data-nav="algorithms">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3l8 3.5v5.5c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6.5L12 3z"/><path d="M9 12l2 2 4-4"/></svg>
          Algorithms
        </a>
      </nav>
    </div>

    <div class="journey" aria-label="Certificate migration states">
      <div class="nav-label" style="padding:0">Migration path</div>
      <div class="journey-steps">
        <span><i style="background:var(--mode-classical)"></i>Classical</span>
        <span class="sep">›</span>
        <span><i style="background:var(--mode-hybrid)"></i>Hybrid</span>
        <span class="sep">›</span>
        <span><i style="background:var(--mode-pq)"></i>PQ ready</span>
      </div>
    </div>

    <div class="sidebar-foot">
      <p class="safety">System prepares · <b>a human approves</b> · system verifies. Janus never changes production credentials on its own.</p>
      <a href="/docs" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h12v16H6a2 2 0 00-2 2V5z"/><path d="M4 19a2 2 0 012-2h12v4H6a2 2 0 01-2-2z"/></svg>
        API documentation
      </a>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-right">
        <span class="env" title="Sample data and an in-memory certificate authority">Demo environment</span>
        <button class="user" id="user" title="Change the administrator name used for approvals">
          <span class="avatar" id="avatar"></span>
          <span class="user-text"><b id="user-name"></b><small>Administrator</small></span>
        </button>
      </div>
    </header>
    <main id="view" tabindex="-1">
      <div class="skeleton"></div>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

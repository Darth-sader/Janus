[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-hybrid-pq-pki"
version = "0.2.0"
description = "Janus: hybrid post-quantum PKI and cryptographic migration advisor (crypto layer, PKI, migration platform)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50",          # native ML-DSA, needed by pki/
    "pqcrypto>=1.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["crypto*", "crypto_agility*", "pki*", "migration_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests", "pki/tests"]
pythonpath = ["."]
addopts = "-q"
